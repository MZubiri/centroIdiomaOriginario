<section id="faq" class="section">
  <div class="container">
    <div class="section-header">
      <span class="section-badge blue">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
        Resolución de Dudas Frecuentes
      </span>
      <h2 class="section-title">PREGUNTAS FRECUENTES</h2>
      <p class="section-description">
        Información clara y transparente acerca del proceso formativo, rúbricas de evaluación, modalidades y acreditación oficial.
      </p>
    </div>

    <div class="faq-accordion-wrap">
      @for (item of faqItems; track item.id) {
        <div class="faq-item card" [class.open]="isFaqOpen(item.id)">
          <button 
            type="button" 
            class="faq-trigger" 
            (click)="toggleFaq(item.id)"
            [attr.aria-expanded]="isFaqOpen(item.id)">
            <span class="faq-question">{{ item.question }}</span>
            <div class="faq-icon-pill">
              @if (isFaqOpen(item.id)) {
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"></line></svg>
              } @else {
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
              }
            </div>
          </button>

          @if (isFaqOpen(item.id)) {
            <div class="faq-content">
              <p class="faq-answer">{{ item.answer }}</p>
            </div>
          }
        </div>
      }
    </div>
  </div>
</section>
